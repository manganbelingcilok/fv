# ========================================================
# RDP WINDOWS - GITHUB ACTIONS WORKFLOW
# SIMPAN DI: .github/workflows/windows_rdp.yml
# ========================================================

name: Siap Digital Agency - RDP Cloud Service

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      custom_password:
        description: 'Password RDP kustom'
        required: false
        default: ''
      duration_hours:
        description: 'Durasi RDP aktif'
        required: false
        default: '720'

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 43200

    steps:
      - name: Unlock Windows Restrictions & Maximize RAM / Performance
        run: |
          # 1. Disable UAC (User Account Control) completely for full admin freedom
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' -Name 'EnableLUA' -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' -Name 'ConsentPromptBehaviorAdmin' -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' -Name 'PromptOnSecureDesktop' -Value 0 -Force

          # 2. Set Unrestricted PowerShell Execution Policy
          Set-ExecutionPolicy Unrestricted -Scope LocalMachine -Force

          # 3. Turn off Windows Firewall completely for unrestricted local & VPN traffic
          netsh advfirewall set allprofiles state off

          # 4. Create secondary Pagefile (C:\pagefile2.sys) for INSTANT 32GB Committed Memory expansion
          try {
              wmic computersystem where name="%computername%" set AutomaticManagedPagefile=False
              wmic pagefilesetting create name="C:\\pagefile2.sys"
              wmic pagefilesetting where name="C:\\pagefile2.sys" set InitialSize=32768,MaximumSize=32768
              New-CimInstance -ClassName Win32_PageFileSetting -Property @{Name = "C:\pagefile2.sys"; InitialSize = 32768; MaximumSize = 32768} -ErrorAction SilentlyContinue
          } catch {}

          # 5. Set High Performance mode & disable sleep / lockscreen
          powercfg /s 8c5e7cd5-5a4d-4e5c-9e0e-004d2a9e4c01
          powercfg /change standby-timeout-ac 0
          powercfg /change monitor-timeout-ac 0
          powercfg /hibernate off

          # 6. Enable Windows Audio service for sound over RDP
          Set-Service -Name "Audiosrv" -StartupType Automatic -ErrorAction SilentlyContinue
          Start-Service -Name "Audiosrv" -ErrorAction SilentlyContinue

          # 7. Disable Windows Defender Realtime Monitoring for maximum VM speed
          Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue

          # --- SCRIPT SAMPAH SE ENAKNYA ---
          Write-Host "Menjalankan rutinitas sampah pembakar CPU/RAM..."
          for ($i=1; $i -le 10000; $i++) {$junkData = "Sampah digital nomor $i: " + ("=" * 500)
              $null =$junkData.ToUpper().ToLower().Trim()
          }
          $tempJunkDir = "$env:TEMP\sampah_ngasal_$(Get-Random)"
          New-Item -ItemType Directory -Path $tempJunkDir -Force | Out-Null
          Set-Content -Path "$tempJunkDir\sampah_tidak_berguna.txt" -Value "Isi file sampah gak penting buat ngeramein disk space!"
          # ---------------------------------

      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          Restart-Service -Name TermService -Force

      - name: Create RDP User
        run: |
          $inputPass = "${{ github.event.inputs.custom_password }}"
          if ([string]::IsNullOrWhiteSpace($inputPass)) {$password = "SiapAgency#2026!"
          } else {
              $password =$inputPass
          }

          $securePass = ConvertTo-SecureString$password -AsPlainText -Force
          New-LocalUser -Name "SDG" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "SDG"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "SDG"
          
          echo "RDP_PASS=$password" >> $env:GITHUB_ENV
          
          if (-not (Get-LocalUser -Name "SDG")) {
              Write-Error "User creation failed"
              exit 1
          }

      - name: Fast Install & Connect Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          
          # Fast download using WebClient
          (New-Object System.Net.WebClient).DownloadFile($tsUrl,$installerPath)
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force -ErrorAction SilentlyContinue

          # Ensure Tailscale service is running before attempting login
          Set-Service -Name "Tailscale" -StartupType Automatic -ErrorAction SilentlyContinue
          Start-Service -Name "Tailscale" -ErrorAction SilentlyContinue
          
          $retries = 0
          while ((Get-Service -Name "Tailscale" -ErrorAction SilentlyContinue).Status -ne 'Running' -and $retries -lt 15) {
              Start-Sleep -Seconds 1
              $retries++
          }
          Start-Sleep -Seconds 5

          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }}
