# ======================================================== #
# SSH LINUX (UBUNTU) - GITHUB ACTIONS WORKFLOW             #
# SIMPAN DI: .github/workflows/ubuntu_ssh.yml             #
# ======================================================== #
name: Siap Digital Agency - Ubuntu SSH Cloud Service

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      custom_password:
        description: 'Password SSH kustom (biarkan kosong untuk SiapAgency#2026!)'
        required: false
        default: ''
      duration_hours:
        description: 'Durasi SSH aktif (dalam jam, contoh: 720 untuk 30 hari - maks 840 jam / 35 hari)'
        required: false
        default: '720'

jobs:
  ubuntu-ssh:
    runs-on: self-hosted
    timeout-minutes: 43200
    steps:
      - name: Configure SSH Server & Create User
        run: |
          sudo sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config || true
          sudo sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config || true
          sudo service ssh restart || sudo systemctl restart ssh || true

          inputPass="${{ github.event.inputs.custom_password }}"
          if [ -z "$inputPass" ]; then
            password="SiapAgency#2026!"
          else
            password="$inputPass"
          fi
          
          sudo useradd -m -s /bin/bash SDG 2>/dev/null || true
          echo "SDG:$password" | sudo chpasswd
          sudo usermod -aG sudo SDG || true
          echo "SSH_PASS=$password" >> $GITHUB_ENV

      - name: Install and Connect Tailscale (User Mode)
        run: |
          curl -sLO https://tailscale.com
          tar -xzf tailscale_1.42.0_amd64.tgz
          cd tailscale_1.42.0_amd64
          
          ./tailscaled --tun=userspace-networking --socks5-server=localhost:1055 --outbound-http-proxy-listen=localhost:1055 &
          sleep 5
          
          ./tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=ubuntu-agency-${{ github.run_id }} --accept-dns=false
          
          tsIP=$(./tailscale ip -4)
          echo "TAILSCALE_IP=$tsIP" >> $GITHUB_ENV

      - name: Display Connection Info & Generate Direct Download Launcher
        run: |
          cat << 'EOF' > Siap_Digital_Agency_SSH_AutoLogin.bat
          @echo off
          title Siap Digital Agency - Ubuntu SSH Auto Login Launcher
          color 0A
          echo ========================================================
          echo SIAP DIGITAL AGENCY - AUTOMATED SSH LAUNCHER
          echo ========================================================
          echo.
          echo Connecting to Ubuntu SSH Server...
          echo IP Address : __TS_IP__
          echo Username   : SDG
          echo Password   : __SSH_PASS__
          echo ========================================================
          echo.
          ssh SDG@__TS_IP__
          pause
          EOF

          sed -i "s/__TS_IP__/$TAILSCALE_IP/g" Siap_Digital_Agency_SSH_AutoLogin.bat
          sed -i "s/__SSH_PASS__/$SSH_PASS/g" Siap_Digital_Agency_SSH_AutoLogin.bat

          directUrlBat=$(curl -s -F "reqtype=fileupload" -F "time=24h" -F "fileToUpload=@Siap_Digital_Agency_SSH_AutoLogin.bat" https://catbox.moe)

          echo "========================================================"
          echo "       SIAP DIGITAL AGENCY - UBUNTU SSH SERVICE        "
          echo "========================================================"
          echo " Tailscale IP   : $TAILSCALE_IP"
          echo " Username       : SDG"
          echo " Password       : $SSH_PASS"
          echo "--------------------------------------------------------"
          echo " 🚀 SSH Command:"
          echo " ssh SDG@$TAILSCALE_IP"
          echo " --------------------------------------------------------"
          echo " ⚡ LINK DIRECT DOWNLOAD LAUNCHER SSH (.BAT):"
          echo " $directUrlBat"
          echo "========================================================"

      - name: Maintain Connection
        run: |
          inputHours="${{ github.event.inputs.duration_hours }}"
          if [ -z "$inputHours" ]; then
            hours=720
          else
            hours=$inputHours
          fi
          totalSeconds=$((hours * 3600))
          elapsed=0
          echo "=== Ubuntu SSH Maintain Loop Started ($hours Jam) ==="
          while [ $elapsed -lt $totalSeconds ]; do
            echo "[$(date)] Ubuntu SSH Active ($elapsed / $totalSeconds sec)"
            sleep 300
            elapsed=$((elapsed + 300))
          done
          echo "Timeout $hours jam tercapai. Runner selesai."
